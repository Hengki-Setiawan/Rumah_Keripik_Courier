name: E2E Mobile (Detox)

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detox:
    name: Android Detox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm install
      - name: Prebuild Android
        run: npx expo prebuild --no-install
      - name: Build APK
        run: npx expo run:android --variant debug --no-install 2>&1 || (cd android && ./gradlew assembleDebug --no-daemon 2>&1)
      - name: Run Detox
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: Pixel_6_API_34
          api-level: 34
          target: google_apis
          arch: x86_64
          script: npx detox test --configuration android.emu.debug --cleanup --headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detox-report
          path: artifacts/
          retention-days: 14
