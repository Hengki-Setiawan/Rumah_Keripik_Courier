name: E2E Mobile (Maestro)

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    name: Android Maestro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm install
      - name: Prebuild Android
        run: npx expo prebuild --no-install
      - name: Build APK
        run: npx expo run:android --variant debug --no-install 2>&1 || (cd android && ./gradlew assembleDebug --no-daemon 2>&1)
      - name: Setup Maestro + Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: Pixel_6_API_34
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            maestro test maestro/ --format junit --output maestro-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: maestro-report.xml
          retention-days: 14
