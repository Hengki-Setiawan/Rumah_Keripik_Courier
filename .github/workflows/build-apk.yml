name: Build Courier APK
on:
  push:
    branches: [master, build/standalone-apk]
    tags: ['v*']
  pull_request:
    branches: [master, build/standalone-apk]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install dependencies
        run: npm install
      - name: Prebuild (generate android folder)
        run: npx expo prebuild --no-install
      - name: Configure Single arm64-v8a Release APK for Itel RS4
        run: |
          node -e "
            const fs = require('fs');
            let build = fs.readFileSync('android/app/build.gradle', 'utf8');
            build = build.replace(
              /buildTypes\s*\{[\s\S]*?release\s*\{/,
              'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n'
            );
            build = build.replace(
              /    defaultConfig {/,
              '    splits {\n        abi {\n            enable true\n            reset()\n            include \"arm64-v8a\"\n            universalApk false\n        }\n    }\n    defaultConfig {'
            );
            fs.writeFileSync('android/app/build.gradle', build);
          "
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Single Release APK (arm64-v8a)
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Upload Single Itel RS4 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rumah-Keripik-Courier-Itel-RS4-Release.apk
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          fail_on_unmatched_files: false
